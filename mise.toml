[tools]
node = "24.16"
pnpm = "11.15.0"
"npm:lunorash" = "1.0.0-alpha.437" # exact: npm's `latest` is a 0.0.1 placeholder
"npm:wrangler" = "4.153.0"

[env]
# The one setting: APP is the template name, which is also the app's folder in examples/.
APP = "{{ get_env(name='APP', default='tanstack-start-react') }}"

# One way: APP=<name> mise run app:verify   (or app:dev). <name> is a Lunora template name.
# If examples/<name> doesn't exist yet, run APP=<name> mise run app:create first.
# `mise run demo` runs it, to prove it works.

[tasks."demo"]
description = "APP=rspack-react mise run app:verify"
run = "APP=rspack-react mise run app:verify"

# Every task here is common: the same call into every app in examples/.
# Templates (lunora init -t, from anolilab/lunora templates/, 14 in all), checked 2026-10-27:
# - 12 have dev, build, codegen and deploy, so they fit these tasks.
# - standalone has no build (a Worker only); expo has no dev or build (Expo's own tooling). Don't add them.
# - Proven (install, build, verify, with build running codegen itself): tanstack-start-react,
#   tanstack-start-react-rspack, rspack-react. The rest are untested: check build runs codegen first.
# - Plain `lunora init app -y` is not from templates/ (Vite's starter + a Lunora layer), so it is not used.

[tasks."app:create"]
description = "Create examples/<APP> from the Lunora template of that name. Common. APP=tanstack-start-solid"
dir = "{{config_root}}/examples"
run = 'lunora init "$APP" -t "$APP" -y'

# The chain, in order: install → build → verify. Each runs the one before it. (app:dev needs only install.)
# install: everything needs node_modules.
# build: runs codegen itself in every app in examples/, and writes framework files (TanStack's routeTree.gen.ts).
# verify: after build; type-checking before routeTree.gen.ts exists fails. Passes even with no
#   generated code, so on its own it proves nothing.
# What the same call runs differs per app: build is lunora codegen + vite build (tanstack-start-react)
#   or rsbuild build, whose Lunora plugin runs codegen (the rspack apps); dev is vite or rsbuild dev.

[tasks."app:install"]
description = "Install the app (pnpm install). Common. APP=<name>, default tanstack-start-react"
dir = "{{config_root}}/examples/{{env.APP}}"
run = "pnpm install"

[tasks."app:build"]
description = "Build the app (pnpm build, which also runs codegen). Common. APP=<name>"
depends = ["app:install"]
dir = "{{config_root}}/examples/{{env.APP}}"
run = "pnpm build"

[tasks."app:verify"]
description = "Check the app (lunora verify). Common. APP=<name>"
depends = ["app:build"]
dir = "{{config_root}}/examples/{{env.APP}}"
run = "pnpm lunora verify"

[tasks."app:dev"]
description = "Run the app's dev server (pnpm dev). Common. APP=<name>"
depends = ["app:install"]
dir = "{{config_root}}/examples/{{env.APP}}"
run = "pnpm dev"

# Not in the chain: build already runs codegen in every app. Use it on its own, e.g. after a schema change.

[tasks."app:generate"]
description = "Regenerate Lunora code after a schema change (pnpm codegen). Common. APP=<name>"
depends = ["app:install"]
dir = "{{config_root}}/examples/{{env.APP}}"
run = "pnpm codegen"

[tasks."apps:verify"]
description = "Run app:verify on every app in examples/. Common"
run = "for d in examples/*/; do APP=$(basename $d) mise run app:verify || exit 1; done"
