[tools]
node = "24.16"
"npm:pnpm" = "11.15.0" # from npm, like the rest: the GitHub build's attestation check fails in Claude cloud sessions
"npm:lunorash" = "1.0.0-alpha.437" # exact: npm's `latest` is a 0.0.1 placeholder
# This lunorash runs only `app:create`; build, verify and dev use each app's own copy.
# The same version is in three kinds of place; bump them all together, and `mise run apps:versions`
# (run by apps:verify) fails if any differs:
# - here
# - the plugin tag (lunorash@<version>) in .claude/settings.json
# - "lunorash" in each examples/<app>/package.json (then pnpm install there)
# .claude/install-plugin.sh installs the plugin when Claude starts (Mac or cloud).
# Its end-of-turn `lunora verify` hook only fires when Claude is started inside examples/<app>,
#   so the Stop hook in .claude/settings.json runs `app:check` (below) instead.
# No wrangler here: each app brings and locks its own, and that one builds, runs dev and deploys.

[env]
# The one setting: APP is the template name, which is also the app's folder in examples/.
APP = "{{ get_env(name='APP', default='tanstack-start-react') }}"

# One way: APP=<name> mise run app:verify   (or app:dev). <name> is a Lunora template name.
# If examples/<name> doesn't exist yet, run APP=<name> mise run app:create first.
# `mise run demo` runs it, to prove it works.

[tasks."demo"]
description = "APP=rspack-react mise run app:verify"
run = "APP=rspack-react mise run app:verify"

# Every task here is common: the same call into every app in examples/.
# Templates (lunora init -t, from anolilab/lunora templates/, 14 in all), checked 2026-10-27:
# - 12 have dev, build, codegen and deploy, so they fit these tasks.
# - standalone has no build (a Worker only); expo has no dev or build (Expo's own tooling). Don't add them.
# - Proven (install, build, verify, with build running codegen itself): tanstack-start-react,
#   tanstack-start-react-rspack, rspack-react, and tanstack-start-solid (created and checked, not kept).
#   The rest are untested: check build runs codegen first.
# - Plain `lunora init app -y` is not from templates/ (Vite's starter + a Lunora layer), so it is not used.

[tasks."app:create"]
description = "Create examples/<APP> from the Lunora template of that name. Common. APP=tanstack-start-solid"
dir = "{{config_root}}/examples"
run = 'lunora init "$APP" -t "$APP" -y'

# The chain, in order: install → build → verify. Each runs the one before it. (app:dev needs only install.)
# install: everything needs node_modules.
# build: runs codegen itself in every app in examples/, and writes framework files (TanStack's routeTree.gen.ts).
# verify: after build; it fails without the generated code (lunora/_generated, and TanStack's
#   routeTree.gen.ts), which only build writes.
# What the same call runs differs per app: build is lunora codegen + vite build (tanstack-start-react)
#   or rsbuild build, whose Lunora plugin runs codegen (the rspack apps); dev is vite or rsbuild dev.

[tasks."app:install"]
description = "Install the app (pnpm install). Common. APP=<name>, default tanstack-start-react"
dir = "{{config_root}}/examples/{{env.APP}}"
run = "pnpm install"

[tasks."app:build"]
description = "Build the app (pnpm build, which also runs codegen). Runs app:install first. Common. APP=<name>"
depends = ["app:install"]
dir = "{{config_root}}/examples/{{env.APP}}"
run = "pnpm build"

[tasks."app:verify"]
description = "Check the app (lunora verify). Runs app:install and app:build first. Common. APP=<name>"
depends = ["app:build"]
dir = "{{config_root}}/examples/{{env.APP}}"
run = "pnpm lunora verify"

[tasks."app:dev"]
description = "Run the app's dev server (pnpm dev). Runs app:install first. Common. APP=<name>"
depends = ["app:install"]
dir = "{{config_root}}/examples/{{env.APP}}"
run = "pnpm dev"

# Not in the chain: build already runs codegen in every app. Use it on its own, e.g. after a schema change.

[tasks."app:generate"]
description = "Regenerate Lunora code after a schema change (pnpm codegen). Runs app:install first. Common. APP=<name>"
depends = ["app:install"]
dir = "{{config_root}}/examples/{{env.APP}}"
run = "pnpm codegen"

[tasks."apps:versions"]
description = "Fail if lunorash differs between mise.toml, the plugin tag and any app in examples/. Common"
dir = "{{config_root}}"
run = '''
node -e '
const fs = require("fs");
const want = fs.readFileSync("mise.toml", "utf8").match(/"npm:lunorash" = "([^"]+)"/)[1];
const found = { ".claude/settings.json (plugin tag)": (fs.readFileSync(".claude/settings.json", "utf8").match(/"lunorash@([^"]+)"/) || [])[1] };
for (const app of fs.readdirSync("examples")) {
    const pkg = `examples/${app}/package.json`;
    if (fs.existsSync(pkg)) found[pkg] = JSON.parse(fs.readFileSync(pkg, "utf8")).dependencies?.lunorash;
}
const bad = Object.entries(found).filter(([, v]) => v !== want);
for (const [where, v] of bad) console.error(`lunorash ${v ?? "missing"} in ${where}, mise.toml has ${want}`);
if (bad.length) process.exit(1);
console.log(`lunorash ${want} everywhere (${Object.keys(found).length + 1} places)`);
'
'''

[tasks."apps:verify"]
description = "Run app:verify on every app in examples/. Runs apps:versions first. Common"
depends = ["apps:versions"]
run = "for d in examples/*/; do APP=$(basename $d) mise run app:verify || exit 1; done"

# The end-of-turn check. The Stop hook in .claude/settings.json runs it after every Claude turn, because
# the plugin's own check only looks in the folder Claude started in (the repo root, which has no app).
# Not in the chain: it does nothing when the app's lunora/ is unchanged, and otherwise only `lunora verify`,
#   except on a fresh clone (no lunora/_generated), where it installs and builds once first.

[tasks."app:check"]
description = "Verify the app if its lunora/ has uncommitted changes (the end-of-turn check). Common. APP=<name>"
dir = "{{config_root}}/examples/{{env.APP}}"
run = """
if [ -z "$(git status --porcelain -- lunora)" ]; then echo "app:check: $APP lunora/ unchanged, skipped"; exit 0; fi
# A fresh clone has no generated code yet, and verify fails without it: build once first.
[ -d lunora/_generated ] || { pnpm install && pnpm build; } >&2
pnpm lunora verify
"""
