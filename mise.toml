[tools]
node = "24.16"
pnpm = "11.15.0"
"npm:lunorash" = "1.0.0-alpha.437" # exact: npm's `latest` is a 0.0.1 placeholder
"npm:wrangler" = "4.153.0"

[env]
APP = "{{ get_env(name='APP', default='examples/vite-react') }}" # APP=examples/tanstack-start-react mise run app:dev

# In order. Each step runs the one before it.

[tasks."app:install"]
description = "Common: pnpm install"
dir = "{{config_root}}/{{env.APP}}"
run = "pnpm install"

[tasks."app:generate"]
description = "Common: the app's codegen script, lunora codegen in every app"
depends = ["app:install"]
dir = "{{config_root}}/{{env.APP}}"
run = "pnpm codegen"

[tasks."app:build"]
description = "Common: the app's build script, same name in every app; what it runs differs (vite-react: tsc + vite build; tanstack-start-react: lunora codegen + vite build)"
depends = ["app:generate"]
dir = "{{config_root}}/{{env.APP}}"
run = "pnpm build"

[tasks."app:verify"]
description = "Common: lunora verify, the same command in every Lunora app"
depends = ["app:build"]
dir = "{{config_root}}/{{env.APP}}"
run = "pnpm lunora verify"

[tasks."app:dev"]
description = "Common: the app's dev script, same name in every app (vite in both so far)"
depends = ["app:install"]
dir = "{{config_root}}/{{env.APP}}"
run = "pnpm dev"

[tasks."apps:verify"]
description = "Common: app:verify on every app in examples/"
run = "for d in examples/*/; do APP=${d%/} mise run app:verify || exit 1; done"
