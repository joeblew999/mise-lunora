[tools]
node = "24.16"
pnpm = "11.15.0"
"npm:lunorash" = "1.0.0-alpha.437" # exact: npm's `latest` is a 0.0.1 placeholder
"npm:wrangler" = "4.153.0"

[env]
APP = "{{ get_env(name='APP', default='examples/tanstack-start-react') }}" # APP=examples/tanstack-start-react mise run app:dev

# Every task here is common: the same call into every app in examples/.
# Templates (lunora init -t, from anolilab/lunora templates/, 14 in all), checked 2026-10-27:
# - 12 have dev, build, codegen and deploy, so they fit these tasks.
# - standalone has no build (a Worker only); expo has no dev or build (Expo's own tooling). Don't add them.
# - Proven (install, build, verify, with build running codegen itself): tanstack-start-react,
#   tanstack-start-react-rspack, rspack-react. The rest are untested: check build runs codegen first.
# - Plain `lunora init app -y` is not from templates/ (Vite's starter + a Lunora layer), so it is not used.

[tasks."app:create"]
description = "Common for templates in anolilab/lunora templates/ (lunora init -t)."
dir = "{{config_root}}/examples"
run = 'lunora init "$TEMPLATE" -t "$TEMPLATE" -y'

# In order. Each step runs the one before it.
# install: everything needs node_modules.
# build: runs codegen itself in both apps, and writes framework files (TanStack's routeTree.gen.ts).
# verify: after build; type-checking before routeTree.gen.ts exists fails. Passes even with no
#   generated code, so on its own it proves nothing.

[tasks."app:install"]
description = "Common: pnpm install"
dir = "{{config_root}}/{{env.APP}}"
run = "pnpm install"

[tasks."app:build"]
description = "Common: the app's build script, same name in every app; what it runs differs (tanstack-start-react: lunora codegen + vite build; rspack: rsbuild build, whose Lunora plugin runs codegen)"
depends = ["app:install"]
dir = "{{config_root}}/{{env.APP}}"
run = "pnpm build"

[tasks."app:verify"]
description = "Common: lunora verify, the same command in every Lunora app"
depends = ["app:build"]
dir = "{{config_root}}/{{env.APP}}"
run = "pnpm lunora verify"

[tasks."app:dev"]
description = "Common: the app's dev script, same name in every app; what it runs and its port differ (vite on 5173, rsbuild on 3000)"
depends = ["app:install"]
dir = "{{config_root}}/{{env.APP}}"
run = "pnpm dev"

# Not in the chain: build already runs codegen in every app. Use it on its own, e.g. after a schema change.

[tasks."app:generate"]
description = "Common: the app's codegen script, lunora codegen in every app"
depends = ["app:install"]
dir = "{{config_root}}/{{env.APP}}"
run = "pnpm codegen"

[tasks."apps:verify"]
description = "Common: app:verify on every app in examples/"
run = "for d in examples/*/; do APP=${d%/} mise run app:verify || exit 1; done"
