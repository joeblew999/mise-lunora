# This file sets up the tools and the commands for trying out Lunora example apps.
# Each app lives in its own folder in examples/. You work on one at a time.
#
# How to use it:
#   1. Pick the app:          APP=rspack-react   (default: tanstack-start-react)
#   2. Check it works:        APP=rspack-react mise run app:verify
#      That runs install, then build, then verify, in that order.
#   3. Or run it:             APP=rspack-react mise run app:dev
#   New app? Make it first:   APP=<name> mise run app:create
#   Just want to see it work: mise run demo
#
# `mise tasks` lists every command.

# The tools. mise installs these; the apps bring everything else themselves.
[tools]
node = "24.16"
# pnpm comes from npm because the GitHub download fails a security check in Claude cloud sessions.
"npm:pnpm" = "11.15.0"
# The Lunora command (`lunora`). Pinned exactly: on npm, "latest" is an empty 0.0.1 placeholder.
# This copy is only used to create apps (app:create). Once an app exists, it uses its own copy.
#
# When you upgrade Lunora, change the version in all of these places, then run pnpm install in each app:
#   - here (Lunora's Claude plugin uses this version too)
#   - "lunorash" in each examples/<app>/package.json
# `mise run apps:versions` tells you if any of them don't match.
"npm:lunorash" = "1.0.0-alpha.437"
# No wrangler (Cloudflare's tool) here on purpose: each app installs its own, and uses that one.

[env]
# Which app the commands work on. It's the Lunora template name, and also the folder name in examples/.
APP = "{{ get_env(name='APP', default='tanstack-start-react') }}"

# Proves everything works on one known-good app.
[tasks."demo"]
description = "APP=rspack-react mise run app:verify"
run = "APP=rspack-react mise run app:verify"

# Makes a new app in examples/ from one of Lunora's 14 templates. Checked on 2026-10-27:
#   - Works with these commands: tanstack-start-react, tanstack-start-react-rspack, rspack-react
#     and tanstack-start-solid. The other templates have the right scripts but haven't been tried.
#   - Don't use standalone (it can't build) or expo (it uses its own tools instead).
#   - Always pick a template. Plain `lunora init` makes a different kind of app.
[tasks."app:create"]
description = "Create examples/<APP> from the Lunora template of that name. Common. APP=tanstack-start-solid"
dir = "{{config_root}}/examples"
run = 'lunora init "$APP" -t "$APP" -y'

# The main commands, in order: install, then build, then verify.
# Each one runs the ones before it, so you only ever need to call the last one you want.

# 1. Install: downloads the app's packages. Everything else needs this.
[tasks."app:install"]
description = "Install the app (pnpm install). Common. APP=<name>, default tanstack-start-react"
dir = "{{config_root}}/examples/{{env.APP}}"
run = "pnpm install"

# 2. Build: builds the app. This also writes the app's generated code (Lunora's, and TanStack's routes).
[tasks."app:build"]
description = "Build the app (pnpm build, which also runs codegen). Runs app:install first. Common. APP=<name>"
depends = ["app:install"]
dir = "{{config_root}}/examples/{{env.APP}}"
run = "pnpm build"

# 3. Verify: checks the app for errors. It needs the generated code, so it always builds first.
[tasks."app:verify"]
description = "Check the app (lunora verify). Runs app:install and app:build first. Common. APP=<name>"
depends = ["app:build"]
dir = "{{config_root}}/examples/{{env.APP}}"
run = "pnpm lunora verify"

# Runs the app on your machine so you can open it in a browser. Only needs install.
[tasks."app:dev"]
description = "Run the app's dev server (pnpm dev). Runs app:install first. Common. APP=<name>"
depends = ["app:install"]
dir = "{{config_root}}/examples/{{env.APP}}"
run = "pnpm dev"

# Rewrites Lunora's generated code, for example after you change lunora/schema.ts.
# Build does this anyway; use this when you only want that step.
[tasks."app:generate"]
description = "Regenerate Lunora code after a schema change (pnpm codegen). Runs app:install first. Common. APP=<name>"
depends = ["app:install"]
dir = "{{config_root}}/examples/{{env.APP}}"
run = "pnpm codegen"

# Checks the Lunora version matches in every place listed at the top.
[tasks."apps:versions"]
description = "Fail if lunorash differs between mise.toml and any app in examples/. Common"
dir = "{{config_root}}"
run = '''
node -e '
const fs = require("fs");
const want = fs.readFileSync("mise.toml", "utf8").match(/"npm:lunorash" = "([^"]+)"/)[1];
const found = {};
for (const app of fs.readdirSync("examples")) {
    const pkg = `examples/${app}/package.json`;
    if (fs.existsSync(pkg)) found[pkg] = JSON.parse(fs.readFileSync(pkg, "utf8")).dependencies?.lunorash;
}
const bad = Object.entries(found).filter(([, v]) => v !== want);
for (const [where, v] of bad) console.error(`lunorash ${v ?? "missing"} in ${where}, mise.toml has ${want}`);
if (bad.length) process.exit(1);
console.log(`lunorash ${want} everywhere (${Object.keys(found).length + 1} places)`);
'
'''

# Runs verify on every app in examples/.
[tasks."apps:verify"]
description = "Run app:verify on every app in examples/. Runs apps:versions first. Common"
depends = ["apps:versions"]
run = "for d in examples/*/; do APP=$(basename $d) mise run app:verify || exit 1; done"

# The end-of-turn check for Claude. After every Claude turn, a hook in .claude/settings.json runs this.
# If the app's lunora/ folder changed, it checks the app for errors, and Claude has to fix them.
# If nothing changed, it does nothing. (Lunora's own Claude plugin has a check like this, but it only
# works when Claude is started inside the app's folder, not from the top of this repo.)
[tasks."app:check"]
description = "Verify the app if its lunora/ has uncommitted changes (the end-of-turn check). Common. APP=<name>"
dir = "{{config_root}}/examples/{{env.APP}}"
run = """
if [ -z "$(git status --porcelain -- lunora)" ]; then echo "app:check: $APP lunora/ unchanged, skipped"; exit 0; fi
# A fresh clone has no generated code yet, and verify fails without it: build once first.
[ -d lunora/_generated ] || { pnpm install && pnpm build; } >&2
pnpm lunora verify
"""
