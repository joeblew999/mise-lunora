# pnpm reads its settings from here (the package.json `pnpm` field is no longer read).
# Pre-approve the toolchain's native build scripts so `pnpm install` runs them
# without the interactive `pnpm approve-builds` step; deny the optional native
# builds a scaffold doesn't need (so no C/C++ toolchain is required).
allowBuilds:
  '@parcel/watcher': true
  'esbuild': true
  'lmdb': true
  'msgpackr-extract': true
  'rs-module-lexer': true
  'sharp': true
  'unrs-resolver': true
  'vue-demi': true
  'workerd': true
  'cpu-features': false
  'protobufjs': false
  'ssh2': false
minimumReleaseAgeExclude:
  - '@lunora/advisor@1.0.0-alpha.260'
  - '@lunora/agent@1.0.0-alpha.251'
  - '@lunora/ai@1.0.0-alpha.147'
  - '@lunora/bindings@1.0.0-alpha.136'
  - '@lunora/cli@1.0.0-alpha.439'
  - '@lunora/client@1.0.0-alpha.253'
  - '@lunora/codegen@1.0.0-alpha.361'
  - '@lunora/config@1.0.0-alpha.415'
  - '@lunora/container@1.0.0-alpha.93'
  - '@lunora/d1@1.0.0-alpha.210'
  - '@lunora/do@1.0.0-alpha.250'
